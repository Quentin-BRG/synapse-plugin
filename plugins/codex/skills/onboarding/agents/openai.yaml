interface:
  display_name: "Synapse onboarding"
  short_description: "Configure Synapse and create a first Collection"
  default_prompt: "Use $onboarding to configure Synapse and create a first Collection."
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "synapse"
      description: "Synapse remote learning service"
      transport: "streamable_http"
      url: "https://synapse.quentin-berger.fr/mcp"
